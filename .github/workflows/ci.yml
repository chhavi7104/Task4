name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Fail the build on syntax errors / undefined names; treat the rest as warnings
          flake8 crawler_pkg cli.py main.py tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 crawler_pkg cli.py main.py tests --count --exit-zero --max-line-length=100 --statistics

      - name: Run unit tests
        run: |
          pytest tests/ -v --maxfail=1

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t webcrawler:ci .
